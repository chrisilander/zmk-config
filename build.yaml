# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # Stock nice!view. Kept alongside the nice-view-gem builds so every CI run also
  # produces a rollback firmware -- flashing these reverts the display with no
  # config changes needed.
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    artifact-name: corne_left_stock
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
    artifact-name: corne_right_stock

  # nice-view-gem (M165437/nice-view-gem, pinned in config/west.yml).
  # `nice_view_gem` replaces `nice_view`; `nice_view_adapter` stays and must come
  # first. Never list `nice_view` and `nice_view_gem` in the same shield list --
  # both define zmk_display_status_screen(), so that is a duplicate symbol.
  # Settings live in config/nice_view_gem.conf.
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    artifact-name: corne_left_gem
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem
    artifact-name: corne_right_gem

    # This builds an artifact to reset base settings, like pairing information
    # etc. Uncomment to build, then flash with this firmware before the real one
    # for each board.
    # - board: nice_nano_v2
    #   shield: settings_reset
