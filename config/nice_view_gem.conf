# Settings for the nice-view-gem display shield.
#
# This file is only applied to builds whose shield list contains `nice_view_gem`.
# ZMK collects config/<shield>.conf for every shield in the list, so the stock
# `nice_view` builds never see it. Keeping these out of corne.conf is required,
# not just tidy: corne.conf applies to all four builds, and Zephyr aborts the
# build on an assignment to an undefined Kconfig symbol.

# Crystal animation on the peripheral (right) half -- the central half has no
# animation, so these settings do nothing there.
#
# There are 16 frames and ANIMATION_MS is the length of the whole cycle, so the
# per-frame interval is ANIMATION_MS / 16 (60ms here, i.e. ~17fps -- the module
# README's "60 fps" for this value is wrong).
CONFIG_NICE_VIEW_GEM_ANIMATION=y
CONFIG_NICE_VIEW_GEM_ANIMATION_MS=960

# Battery-saving alternatives. Uncomment one and comment out the two lines above.
# CONFIG_NICE_VIEW_GEM_ANIMATION_MS=96000  # ~6s per frame
# CONFIG_NICE_VIEW_GEM_ANIMATION=n         # single still frame
#
# With ANIMATION=n the frame is picked at random on each boot. Fixing a specific
# frame needs CONFIG_NICE_VIEW_GEM_ANIMATION_FRAME, which only exists on the
# module's `main` branch -- not on the v0.3.0 tag we are pinned to.

# Other options the v0.3.0 tag exposes, left at their defaults:
# CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE=y      # scale the WPM gauge to a fixed max
# CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE_MAX=100
# CONFIG_NICE_VIEW_WIDGET_INVERTED=y          # dark theme; use this rather than
#                                             # CONFIG_ZMK_DISPLAY_INVERT, which
#                                             # misbehaves with image-based screens
